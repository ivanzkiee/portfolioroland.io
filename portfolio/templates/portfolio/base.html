<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Portfolio{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'portfolio/images/roland.png' %}">
    <!-- Theme bootstrap (prevents flash while CSS loads) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 28%),
                        linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
            color: #0f172a;
            min-height: 100vh;
            line-height: 1.6;
        }

        a {
            color: inherit;
        }
    </style>
    <script>
        (function () {
            try {
                var key = 'theme';
                var stored = window.localStorage && window.localStorage.getItem(key);
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = stored ? stored : (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (e) {
                // If storage is blocked, just rely on prefers-color-scheme in CSS.
            }
        })();
    </script>
    <!-- Theme toggle is handled in static/portfolio/js/main.js -->
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="{% url 'home' %}" aria-label="Home">
                    <span class="brand-text" aria-hidden="true">
                        <span class="brand-default">Roland Ivan</span>
                        <span class="brand-name">Roland Ivan</span>
                    </span>
                </a>
            </div>
            <div class="nav-right">
                <ul id="primary-navigation" class="nav-menu">
                    <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
                    <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About Me</a></li>
                    <li><a href="{% url 'skills' %}" class="{% if request.resolver_match.url_name == 'skills' %}active{% endif %}">Skills</a></li>
                    <li><a href="{% url 'projects' %}" class="{% if request.resolver_match.url_name == 'projects' %}active{% endif %}">Projects</a></li>
                    <li><a href="{% url 'experience' %}" class="{% if request.resolver_match.url_name == 'experience' %}active{% endif %}">Experience</a></li>
                    <li><a href="{% url 'resume' %}" class="{% if request.resolver_match.url_name == 'resume' %}active{% endif %}">Resume</a></li>
                    <li><a href="{% url 'achievements' %}" class="{% if request.resolver_match.url_name == 'achievements' %}active{% endif %}">Achievements</a></li>
                    <li><a href="{% url 'contact' %}" class="{% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a></li>
                </ul>
            </div>
            <button type="button" class="hamburger" aria-label="Toggle navigation menu" aria-controls="primary-navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div id="certificateModal" class="certificate-modal" role="dialog" aria-modal="true" aria-label="Media viewer" aria-hidden="true">
        <button type="button" class="modal-close" onclick="closeModal()" aria-label="Close media viewer">&times;</button>
        <div class="modal-heading">
            <span class="modal-kind" id="modalKind">Media Preview</span>
            <h2 id="modalTitle">Project Media</h2>
        </div>
        <img class="modal-content" id="modalImage" alt="">
        <video class="modal-video" id="modalVideo" controls playsinline></video>
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <div id="experienceImageModal" class="experience-image-modal" role="dialog" aria-modal="true" aria-label="Experience photo viewer" aria-hidden="true">
        <button type="button" class="modal-close" onclick="closeExperienceImageModal()" aria-label="Close experience photo viewer">&times;</button>
        <img class="modal-content" id="experienceModalImage" alt="">
        <div class="modal-caption" id="experienceModalCaption"></div>
    </div>

    <aside class="assistant-widget" aria-label="Ask Roland AI assistant">
        <button type="button" class="assistant-toggle" id="assistantToggle" aria-controls="assistantPanel" aria-expanded="false">
            <i class="fas fa-comment-dots" aria-hidden="true"></i>
            <span>Ask Roland AI</span>
        </button>
        <section class="assistant-panel" id="assistantPanel" role="dialog" aria-modal="false" aria-labelledby="assistantTitle" aria-hidden="true">
            <header class="assistant-header">
                <div>
                    <span class="assistant-status"><span></span> Portfolio assistant</span>
                    <h2 id="assistantTitle">Ask Roland AI</h2>
                </div>
                <button type="button" class="assistant-close" id="assistantClose" aria-label="Close Ask Roland AI">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </header>
            <div class="assistant-messages" id="assistantMessages" aria-live="polite" aria-label="Chat messages"></div>
            <div class="assistant-suggestions" id="assistantSuggestions" aria-label="Suggested questions"></div>
            <form class="assistant-form" id="assistantForm">
                <label class="sr-only" for="assistantInput">Ask Roland AI a question</label>
                <input id="assistantInput" name="question" type="text" autocomplete="off" placeholder="Ask about Roland..." maxlength="240" required>
                <button type="submit" aria-label="Send question">
                    <i class="fas fa-arrow-up" aria-hidden="true"></i>
                </button>
            </form>
        </section>
    </aside>

    <footer class="footer">
        <div class="container">
            <div class="footer-social-links" aria-label="Social media links">
                <a href="https://www.linkedin.com/in/roland-ivan-m-palasigue-9439751a1/" class="footer-social-link" aria-label="LinkedIn" title="LinkedIn" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-linkedin" aria-hidden="true"></i>
                </a>
                <a href="https://github.com/ivanzkiee" class="footer-social-link" aria-label="GitHub" title="GitHub" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-github" aria-hidden="true"></i>
                </a>
                <a href="https://www.facebook.com/gandaaaaaaah" class="footer-social-link" aria-label="Facebook" title="Facebook" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-facebook" aria-hidden="true"></i>
                </a>
                <a href="https://www.instagram.com/hey.rovan/" class="footer-social-link" aria-label="Instagram" title="Instagram" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-instagram" aria-hidden="true"></i>
                </a>
            </div>
            <p>&copy; 2025 Roland Ivan M. Palasigue. All rights reserved.</p>
        </div>
    </footer>

    <script src="{% static 'portfolio/js/main.js' %}"></script>
    <script src="{% static 'portfolio/js/clippy-assistant.js' %}?v=2"></script>
</body>
</html>
